name: evening-paper
# Rebuilds the paper (mock) trading dashboard files after the market closes, checks them, and commits the result.
# One quick pass, safe to start many times: a start after the day's results are complete stops in seconds.
# An outside timer starts it every 10 minutes from 16:00 to 18:00 India time (that is what makes it on time);
# the schedules below are only a backup, because GitHub can start scheduled runs hours late or skip them.
# It also downloads the day's candles itself, so it does not wait for the separate intraday-candles job.
on:
  schedule:
    - cron: "37 10 * * 1-5"   # 16:07 India time
    - cron: "22 11 * * 1-5"   # 16:52 India time
    - cron: "7 12 * * 1-5"    # 17:37 India time
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency: { group: evening-paper, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest main, not the commit that was current when the schedule fired
      - id: due
        run: |
          if python3 paper/evening_due.py; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.due.outputs.done != 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.due.outputs.done != 'true'
        run: python3 fetch_intraday.py
      - if: steps.due.outputs.done != 'true'
        run: python3 paper/evening.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - if: steps.due.outputs.done != 'true'
        run: python3 paper/shadow_vix.py
        continue-on-error: true
      - if: steps.due.outputs.done != 'true'
        run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/intraday data/mock/dash data/live
          git diff --cached --quiet && exit 0
          git commit -q -m "paper ledger $(TZ=Asia/Kolkata date -d '6 hours ago' +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((5 * i))
          done
          echo "::error title=push failed::Evening results were not saved to the repository"
          exit 1
