name: index-history
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 fetch_index_history.py
      - run: |
          git config user.name "intraday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/index
          git diff --cached --quiet || git commit -m "index history $(date -u +%F)"
          git push
