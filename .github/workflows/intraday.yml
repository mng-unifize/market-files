name: intraday-candles
on:
  schedule:
    - cron: "45 10 * * 1-5"   # 16:15 India time, after the 15:30 close
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 fetch_intraday.py
      - run: |
          git config user.name "intraday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/intraday
          git diff --cached --quiet || git commit -m "intraday candles $(date -u +%F)"
          git push
