name: kite-margin-check
on:
  workflow_dispatch:
    inputs:
      request_token:
        description: "Paste the whole address from the browser after Zerodha login (or just the request_token value)"
        required: true
permissions:
  contents: write
jobs:
  margin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kiteconnect
      - run: python3 2026-11-22-kite_margin_check.py
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_REQUEST_TOKEN: ${{ github.event.inputs.request_token }}
      - run: |
          git config user.name "intraday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live/margin_per_lot.json
          git diff --cached --quiet || git commit -m "margin per lot $(date -u +%F)"
          git pull --rebase
          git push
