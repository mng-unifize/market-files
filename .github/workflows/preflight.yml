name: preflight
# Morning check after your Kite login: token, indexes, futures contracts, lot sizes, candle flow, quotes.
# It is safe to start many times: a start after today's check has passed stops in seconds. An outside timer starts it at
# 09:00, 09:05 and 09:10 India time on weekdays (that is what makes it before the 09:15 open); the two schedules below
# are only a backup, because GitHub can start scheduled runs hours late or skip them. A failure emails you.
on:
  schedule:
    - cron: "27 3 * * 1-5"   # 08:57 India time
    - cron: "42 3 * * 1-5"   # 09:12 India time
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: preflight, cancel-in-progress: false }
jobs:
  gate:
    # Holiday gate: scheduled runs stop on the NSE/BSE holidays built into this job. Manual runs always go ahead.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      holiday: ${{ steps.h.outputs.holiday }}
    steps:
      - id: h
        run: |
          echo "holiday=false" >> "$GITHUB_OUTPUT"
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          today=$(TZ=Asia/Kolkata date +%F)
          # NSE and BSE weekday trading holidays, 2026. Same dates as holidays.txt. Update each January.
          case "$today" in
            2026-*) ;;
            *) echo "::warning::Holiday list covers 2026 only, running as a normal trading day"; exit 0 ;;
          esac
          for h in 2026-01-15 2026-01-26 2026-03-03 2026-03-26 2026-03-31 2026-04-03 2026-04-14 2026-05-01 2026-05-28 2026-06-26 2026-09-14 2026-10-02 2026-10-20 2026-11-10 2026-11-24 2026-12-25; do
            if [ "$h" = "$today" ]; then
              echo "holiday=true" >> "$GITHUB_OUTPUT"
              echo "Market holiday ($today), skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
  check:
    needs: gate
    if: needs.gate.outputs.holiday != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest main, not the commit that was current when the schedule fired
      - id: due
        run: |
          if python3 paper/preflight_due.py; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.due.outputs.done != 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.due.outputs.done != 'true'
        run: pip install kiteconnect
      - id: pre
        if: steps.due.outputs.done != 'true'
        run: python3 paper/preflight.py
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
      - name: Commit result
        if: always() && steps.due.outputs.done != 'true'
        run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live/preflight.json
          git diff --cached --quiet && exit 0
          git commit -q -m "preflight $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((5 * i))
          done
          echo "::error title=push failed::Preflight result was not saved to the repository"
          exit 1
