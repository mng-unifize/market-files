name: paper-live
# Records live paper (mock) signals every 5 minutes while the market is open (09:20 to 15:50 India time).
# GitHub only starts a "*/5" schedule about once an hour on this repository, so this workflow starts a few times a day
# and each run keeps its own 5-minute clock (paper/live_loop.py). Each run loops for up to 215 minutes, never past 15:50.
# Dry run by default: set the repository variable PAPER_RECORD to yes to record.
on:
  schedule:
    - cron: "47 3 * * 1-5"    # 09:17 India time (first start, after the morning Kite login, which is done by 09:15)
    - cron: "37 6 * * 1-5"    # 12:07 India time
    - cron: "47 8 * * 1-5"    # 14:17 India time
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: paper-live, cancel-in-progress: false }
jobs:
  gate:
    # Holiday gate: scheduled runs stop on the NSE/BSE holidays built into this job. Manual runs always go ahead.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      holiday: ${{ steps.h.outputs.holiday }}
    steps:
      - id: h
        run: |
          echo "holiday=false" >> "$GITHUB_OUTPUT"
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          today=$(TZ=Asia/Kolkata date +%F)
          # NSE and BSE weekday trading holidays, 2026. Same dates as holidays.txt. Update each January.
          case "$today" in
            2026-*) ;;
            *) echo "::warning::Holiday list covers 2026 only, running as a normal trading day"; exit 0 ;;
          esac
          for h in 2026-01-15 2026-01-26 2026-03-03 2026-03-26 2026-03-31 2026-04-03 2026-04-14 2026-05-01 2026-05-28 2026-06-26 2026-09-14 2026-10-02 2026-10-20 2026-11-10 2026-11-24 2026-12-25; do
            if [ "$h" = "$today" ]; then
              echo "holiday=true" >> "$GITHUB_OUTPUT"
              echo "Market holiday ($today), skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
  live:
    needs: gate
    if: needs.gate.outputs.holiday != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # newest main, not the commit that was current when the schedule fired
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kiteconnect
      - run: |
          git config user.name "paper-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Live loop
        run: python3 paper/live_loop.py --max-minutes 215
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          PAPER_RECORD: ${{ vars.PAPER_RECORD }}
